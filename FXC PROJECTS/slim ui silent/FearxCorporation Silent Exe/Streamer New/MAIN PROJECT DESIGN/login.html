<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FEAR STREAMER — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5c85ff;
      --primary-glow: rgba(92, 133, 255, 0.25);
      --bg-dark: #000000;
      --panel-bg: rgba(22, 24, 30, 0.95);
      --border-color: rgba(255, 255, 255, 0.04);
      --text-main: #e6edf3;
      --text-dim: #8b949e;
      --error: #f85149;
    }

    *, *::before, *::after { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(92, 133, 255, 0.25), transparent);
      border-radius: 16px 16px 0 0;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .logo-title span {
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .logo-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #fff;
      outline: none;
      transition: all 0.2s ease-in-out;
    }

    .field input::placeholder { 
      color: #4b5563; 
    }

    .field input:focus {
      border-color: var(--primary);
      background: rgba(92, 133, 255, 0.02);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(135deg, rgba(92, 133, 255, 0.08), rgba(92, 133, 255, 0.2));
      border: 1px solid rgba(92, 133, 255, 0.8);
      border-radius: 8px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(92, 133, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Error message */
    .error-box {
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 18px;
      display: none;
      text-align: center;
      font-weight: 500;
    }
    .error-box.show { display: block; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-title">FEAR <span>STREAMER</span></div>
    <div class="logo-sub">Advanced Security Protocol</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <form method="POST" action="/" id="loginForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter security license" required autocomplete="off">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter access credentials" required>
    </div>
    <button type="submit" class="btn">Authenticate</button>
  </form>

  <div class="footer-text">Secured by <span style="color: var(--primary); text-shadow: 0 0 8px var(--primary-glow);">FEAR</span></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    const box = document.getElementById('errorBox');
    box.textContent = decodeURIComponent(params.get('error'));
    box.classList.add('show');
  }
</script>
</body>
</html>
